app = "dumbitdown"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  BACKEND_HOST = "0.0.0.0"
  BACKEND_PORT = "8080"
  VECTOR_STORE_TYPE = "qdrant"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
