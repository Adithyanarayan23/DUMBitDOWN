version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - HF_API_KEY=${HF_API_KEY}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=5000
      - VECTOR_STORE_TYPE=${VECTOR_STORE_TYPE:-faiss}
      - VECTOR_STORE_PATH=/app/data/vector_store
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-dumbitdown_papers}
      - CONVERSATION_DB_PATH=/app/data/conversations.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      # Prefer a Vite production build. Run: cd frontend && npm run build
      # Then this serves dist/. Do NOT mount raw frontend/ source (broken for React).
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - with-nginx

  # Optional: Local Qdrant for development
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    profiles:
      - with-qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
